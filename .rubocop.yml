AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "spec/**/*"
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Max: 400
Metrics/AbcSize:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Lint/StructNewOverride:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
Layout/EmptyLineAfterGuardClause:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Lint/DuplicateBranch:
  Enabled: false
Style/Semicolon:
  Enabled: false
Style/RedundantBegin:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
